# Render Blueprint — deploys the backend + Postgres in one pass from the
# Render dashboard ("New +" -> "Blueprint", point at this repo). Render's
# blueprint schema does shift between dashboard versions; if this doesn't
# match what you see on-screen, DEPLOY.md's manual dashboard steps are the
# fallback and don't depend on this file being exactly right.
#
# The frontend is NOT included here — it's deployed separately as a static
# site (Vercel is simpler for that than Render's static-site flow; see
# DEPLOY.md). Splitting them means the frontend redeploys in ~30s on every
# push instead of waiting on the Python image rebuild.

databases:
  - name: dvv-postgres
    plan: free
    databaseName: dvv_research
    user: dvv

services:
  - type: web
    name: dvv-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: dvv-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # Secrets Render can't generate — set these yourself in the dashboard
      # after the first deploy (see DEPLOY.md's env var checklist). Left
      # unset here on purpose: a real value in this file would leak into
      # git history the moment it's committed.
      - key: GROQ_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
    # Persistent disk for uploaded studies (data.parquet, crosstabs.json,
    # rendered decks, chart PNGs) — REQUIRES A PAID PLAN. On the free plan,
    # remove this block; /app/studies then lives on the container's ephemeral
    # filesystem and every upload is lost on the next deploy or restart. Fine
    # for a one-off demo (upload fresh, show it, done); not fine for
    # anything meant to persist between sessions.
    disk:
      name: studies-data
      mountPath: /app/studies
      sizeGB: 1
