# Render Blueprint — deploys the backend + Postgres in one pass from the
# Render dashboard ("New +" -> "Blueprint", point at this repo). Render's
# blueprint schema does shift between dashboard versions; if this doesn't
# match what you see on-screen, DEPLOY.md's manual dashboard steps are the
# fallback and don't depend on this file being exactly right.
#
# The frontend is NOT included here — it's deployed separately as a static
# site (Vercel is simpler for that than Render's static-site flow; see
# DEPLOY.md). Splitting them means the frontend redeploys in ~30s on every
# push instead of waiting on the Python image rebuild.

# NO `databases:` block on purpose.
#
# Render's FREE Postgres expires (30-90 days depending on when you read their
# docs) and is then deleted after a short grace period. That is exactly what
# took production down on 2026-08: the database was suspended, the backend
# could not connect, and the API was dead while the Vercel frontend stayed up
# and pointed at nothing. Provisioning another free one here would just restart
# that clock.
#
# Use an external Postgres with no expiry instead, and set DATABASE_URL by hand
# in the Render dashboard. Neon's free tier (neon.tech) is the recommended one:
# 0.5 GB, no expiry, scales to zero and wakes in about a second. Supabase also
# works but PAUSES a free project after 7 days of inactivity, which is worse for
# something demoed occasionally.
#
# Paste Neon's POOLED connection string (it ends in `-pooler...`), and make sure
# it starts `postgresql://` — SQLAlchemy rejects the `postgres://` form some
# providers still hand out.

services:
  - type: web
    name: dvv-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      # Set by hand in the dashboard — see the note above. Never committed.
      - key: DATABASE_URL
        sync: false
      # Open-weights-only routing. Client questionnaires are NDA-bound, so this
      # must be ON in production: it drops OpenAI/Anthropic from the model chain
      # even if a stale key is still sitting in this service's environment.
      - key: LLM_OPEN_WEIGHTS_ONLY
        value: "1"
      - key: JWT_SECRET
        generateValue: true
      # Secrets Render can't generate — set these yourself in the dashboard
      # after the first deploy (see DEPLOY.md's env var checklist). Left
      # unset here on purpose: a real value in this file would leak into
      # git history the moment it's committed.
      - key: GROQ_API_KEY
        sync: false
      # Optional fallback when Groq fails (429 budget, or a malformed tool
      # call) — without it, any Groq failure drops straight to the weak
      # local model instead. Leave unset if not using it yet.
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
    # No persistent disk on the free plan (Render rejects `disk:` on free
    # services). /app/studies lives on the container's ephemeral filesystem —
    # every uploaded study is lost on the next deploy or restart. Fine for a
    # one-off demo (upload fresh, show it, done); not fine for anything meant
    # to persist between sessions. Re-add a `disk:` block (name, mountPath:
    # /app/studies, sizeGB) once on a paid plan.
