# One client's complete DVV Research Cloud: web app + API, Postgres, HTTPS,
# nightly backups, and (optionally) a local AI model. Nothing outside this file.
#
# Operated through ./dvv — see DEPLOY.md. Settings live in deploy/.env.

name: dvv-${CLIENT_SLUG:?set CLIENT_SLUG in deploy/.env}

services:
  app:
    build:
      context: ..
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://dvv:${POSTGRES_PASSWORD:?}@db:5432/dvv
      PUBLIC_BASE_URL: https://${DOMAIN:?}
      # Local model when the local-ai profile is on; otherwise nothing listens
      # here, the attempt fails instantly and the cloud keys (if any) answer.
      OLLAMA_HOST: http://ollama:11434
    volumes:
      - studies:/app/studies
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    # 40 app connections (api/db.py pool) + backups + headroom for maintenance.
    command: ["postgres", "-c", "max_connections=100", "-c", "shared_buffers=256MB"]
    environment:
      POSTGRES_USER: dvv
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: dvv
    # Reachable from THIS server only (127.0.0.1), never from the internet, so
    # an SSH tunnel can reach it: DBeaver / TablePlus / Power BI on a laptop,
    # through `ssh -L`. Never publish it on 0.0.0.0, and never open 5432 in
    # the Lightsail firewall — that would put client data on the open internet.
    ports:
      - "127.0.0.1:${DB_LOCAL_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dvv -d dvv"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Automatic HTTPS for ${DOMAIN}: certificates are fetched and renewed on
  # their own once the domain's DNS points at this server.
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN:?}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [app]

  backup:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: dvv
      PGPASSWORD: ${POSTGRES_PASSWORD:?}
      PGDATABASE: dvv
      BACKUP_HOUR: ${BACKUP_HOUR:-2}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backup.sh:/backup.sh:ro
      - studies:/studies:ro
      - ./backups:/backups
    entrypoint: ["bash", "/backup.sh"]
    depends_on:
      db:
        condition: service_healthy

  # Off-server copies of the nightly backups, in the client's S3 folder.
  # Enabled with COMPOSE_PROFILES=offsite (or local-ai,offsite) in deploy/.env.
  # Gets only the variables it needs — not the app's whole environment.
  offsite:
    image: amazon/aws-cli
    restart: unless-stopped
    profiles: [offsite]
    entrypoint: ["bash", "/offsite.sh"]
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-ap-south-1}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      CLIENT_SLUG: ${CLIENT_SLUG}
      BACKUP_HOUR: ${BACKUP_HOUR:-2}
    volumes:
      - ./offsite.sh:/offsite.sh:ro
      - ./backups:/backups

  # Enabled per client in deploy/.env with COMPOSE_PROFILES=
  #   embed     the search embedder only (nomic-embed-text, ~270 MB): fits a 4 GB server
  #   local-ai  the embedder AND a local chat/extraction model (~8 GB RAM)
  ollama:
    image: ollama/ollama
    restart: unless-stopped
    profiles: [embed, local-ai]
    environment:
      # One model in memory at a time, kept warm between searches, so a 4 GB
      # server holds the embedder without paging the database out.
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
    # A ceiling, so the AI can never starve Postgres or the app. local-ai
    # clients raise it (OLLAMA_MEMORY=6g) for the bigger model.
    mem_limit: ${OLLAMA_MEMORY:-1g}
    volumes:
      - ollama_models:/root/.ollama

volumes:
  pgdata:
  studies:
  caddy_data:
  ollama_models:
