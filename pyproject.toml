[project]
name = "dvv-research-cloud"
version = "0.1.0"
description = "AI-native survey research platform — DVV Analytics"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "exercises_http_json: drives router.http_json directly, so the suite-wide no-network guard steps aside",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# B008: FastAPI's Depends/File/Form/Query in argument defaults is the framework idiom
"api/**" = ["B008"]
